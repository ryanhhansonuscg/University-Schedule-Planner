name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript unit and browser smoke tests
        run: npm test
      - name: Static syntax checks
        run: |
          python -m compileall -q tools tests
          npm run check
      - name: Validate template fixture
        run: python tools/validate_university.py --template template/university-template
      - name: Reproducible build and SQLite integrity
        env:
          SOURCE_DATE_EPOCH: '1767225600'
        run: |
          tmp=$(mktemp -d)
          cp -R template/university-template "$tmp/fictional-template-university"
          python tools/build_university.py "$tmp/fictional-template-university"
          cp "$tmp/fictional-template-university/catalog.json" "$tmp/first.json"
          cp "$tmp/fictional-template-university/courses.db" "$tmp/first.db"
          python tools/build_university.py "$tmp/fictional-template-university"
          python tools/check_generated.py \
            "$tmp/first.json" "$tmp/first.db" \
            "$tmp/fictional-template-university/catalog.json" \
            "$tmp/fictional-template-university/courses.db"
      - name: Semantic markup smoke checks
        run: node --test tests/semantic-markup-smoke.test.js
      - name: Final repository QA
        run: python tools/final_qa.py
