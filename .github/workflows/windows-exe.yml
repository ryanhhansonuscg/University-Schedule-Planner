name: Build optional Windows executable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-windows-exe:
    name: Build and upload Windows x64 executable
    runs-on: windows-latest

    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Confirm tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ('${{ inputs.tag }}' -cne $expectedTag) {
            Write-Error "Release tag '${{ inputs.tag }}' does not match package version '$packageVersion'. Expected '$expectedTag'."
            exit 1
          }

      - name: Run repository QA
        run: python tools/final_qa.py

      - name: Check Windows packaging contract
        run: python tools/check_windows_packaging.py

      - name: Install pinned PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"

      - name: Build one-directory executable
        run: pyinstaller --clean --noconfirm packaging/windows.spec

      - name: Smoke-test frozen service health and shutdown
        shell: pwsh
        run: |
          $ready = Join-Path $env:RUNNER_TEMP 'planner-ready.json'
          $exe = Resolve-Path 'dist/UniversitySchedulePlanner/UniversitySchedulePlanner.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--serve', '--host', '127.0.0.1', '--port', '0', '--ready-file', $ready) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              if ($process.HasExited) { throw "Frozen service exited with code $($process.ExitCode)." }
              Start-Sleep -Milliseconds 200
            } until ((Test-Path $ready) -or (Get-Date) -gt $deadline)
            if (-not (Test-Path $ready)) { throw 'Frozen service did not publish readiness.' }
            $metadata = Get-Content $ready -Raw | ConvertFrom-Json
            $health = Invoke-RestMethod "http://$($metadata.host):$($metadata.port)/.well-known/university-schedule-planner-health"
            if ($health.pid -ne $process.Id -or $health.repository_root -ne (Split-Path $exe)) {
              throw 'Frozen service returned unexpected health metadata.'
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $process.WaitForExit()
          }

      - name: Package ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $archive = "release/university-schedule-planner-${{ inputs.tag }}-windows-x64.zip"
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'dist/UniversitySchedulePlanner/*' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Verify target release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.tag }}"

      - name: Upload executable assets to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "release/university-schedule-planner-${{ inputs.tag }}-windows-x64.zip" "release/university-schedule-planner-${{ inputs.tag }}-windows-x64.zip.sha256" --clobber
